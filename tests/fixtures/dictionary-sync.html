<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dictionary sync test fixture</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import "../../src/i18n";
      import "../../src/App.css";
      import { DictionarySync } from "../../src/components/settings/dictionary/DictionarySync";
      createRoot(document.getElementById("root")).render(
        React.createElement(DictionarySync, {
          onSynced: async () => {
            window.syncRefreshes = (window.syncRefreshes || 0) + 1;
          },
        }),
      );
    </script>
  </body>
</html>
